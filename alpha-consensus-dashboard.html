  <title>Alpha Consensus — 市場觀點共識盤</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin></script>

<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useCallback } = React;

    /* ============================================================
       Alpha Consensus — 市場觀點共識盤
       對齊 Capafy「Alpha Consensus — X's Top 10 Traders」體驗
       紅 = 看多，綠 = 看空｜僅公開資訊，不構成投資建議
       ============================================================ */

    const STORAGE_KEY = "alphaconsensus:state:v2";

    const DEFAULT_ACCOUNTS = [
      { handle: "unusual_whales", name: "Unusual Whales", focus: "選擇權異常流、國會交易揭露" },
      { handle: "DeItaone", name: "Walter Bloomberg", focus: "即時新聞快訊" },
      { handle: "zerohedge", name: "ZeroHedge", focus: "宏觀、資金流、空方偏向" },
      { handle: "charliebilello", name: "Charlie Bilello", focus: "數據與長期統計" },
      { handle: "LizAnnSonders", name: "Liz Ann Sonders", focus: "總經與市場廣度" },
      { handle: "markminervini", name: "Mark Minervini", focus: "動能與相對強度" },
      { handle: "chamath", name: "Chamath Palihapitiya", focus: "科技與成長股敘事" },
      { handle: "RampCapitalLLC", name: "Ramp Capital", focus: "盤面情緒" },
      { handle: "Mr_Derivatives", name: "Mr. Derivatives", focus: "衍生品部位" },
      { handle: "TheStalwart", name: "Joe Weisenthal", focus: "宏觀敘事" },
    ];

    const STANCE = {
      bull: { label: "看多", short: "多", text: "text-red-400", cell: "bg-red-950", ring: "border-red-800", dot: "bg-red-400" },
      bear: { label: "看空", short: "空", text: "text-emerald-400", cell: "bg-emerald-950", ring: "border-emerald-800", dot: "bg-emerald-400" },
      neutral: { label: "中性／觀望", short: "平", text: "text-slate-300", cell: "bg-slate-800", ring: "border-slate-700", dot: "bg-slate-400" },
      unclear: { label: "未表明", short: "—", text: "text-slate-600", cell: "bg-transparent", ring: "border-slate-800", dot: "bg-slate-700" },
    };

    const EVIDENCE = {
      catalyst: "催化劑／事件",
      valuation: "估值／基本面",
      technical: "技術面",
      flow: "資金流／部位",
      disclosed_trade: "已揭露交易",
      news: "新聞轉述",
      macro: "總體環境",
      sentiment: "情緒面",
    };

    const REPORT_LANGS = [
      { id: "zh-TW", label: "繁體中文" },
      { id: "en", label: "English" },
      { id: "ja", label: "日本語" },
    ];

    const TIME_RANGES = [
      { id: "daily", label: "每日", days: 1 },
      { id: "weekly", label: "每週", days: 7 },
      { id: "monthly", label: "每月", days: 28 },
    ];

    /* ---------- Claude helpers ---------- */
    async function callClaude(messages) {
      const apiKey = localStorage.getItem("anthropic_api_key") || "";
      if (!apiKey) throw new Error("尚未設定 Anthropic API Key。請到「設定」貼上 key，或先載入示範資料。");
      const res = await fetch("https://api.anthropic.com/v1/messages", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "x-api-key": apiKey,
          "anthropic-version": "2023-06-01",
          "anthropic-dangerous-direct-browser-access": "true",
        },
        body: JSON.stringify({
          model: "claude-sonnet-4-20250514",
          max_tokens: 1400,
          messages,
        }),
      });
      if (!res.ok) {
        const t = await res.text().catch(() => "");
        throw new Error(`模型呼叫失敗（${res.status}）${t ? "：" + t.slice(0, 100) : ""}`);
      }
      const data = await res.json();
      return (data.content || []).map((b) => (b.type === "text" ? b.text : "")).filter(Boolean).join("\n");
    }

    function extractJson(text) {
      const cleaned = String(text).replace(/```json/gi, "").replace(/```/g, "").trim();
      const a = cleaned.indexOf("[");
      const b = cleaned.lastIndexOf("]");
      if (a !== -1 && b > a) return JSON.parse(cleaned.slice(a, b + 1));
      const c = cleaned.indexOf("{");
      const d = cleaned.lastIndexOf("}");
      if (c !== -1 && d > c) return JSON.parse(cleaned.slice(c, d + 1));
      throw new Error("模型回傳的內容無法解析成結構化資料");
    }

    const PARSE_INSTRUCTION = `你是市場評論的結構化標註器。把輸入的貼文內容轉成 JSON 陣列。
每個「一位作者對一檔標的的一個立場」是一筆紀錄，欄位如下：
{"handle":"作者帳號(不含@)","ticker":"股票代號(美股用大寫英文，台股用數字代號)","name":"公司名","stance":"bull|bear|neutral|unclear","conviction":1到5的整數,"evidence":["catalyst|valuation|technical|flow|disclosed_trade|news|macro|sentiment" 可多選],"thesis":"一句話說明他的依據，20字內","quote":"原文中最能代表立場的片段，30字內","date":"YYYY-MM-DD","url":"原文連結或空字串"}
規則：
- 只標註有明確個股指涉的內容，純總經無個股時 ticker 填 "MARKET"。
- 作者若只是轉述新聞、沒有表態，stance 用 "unclear"。
- 不要推測作者沒說的東西；thesis 必須能在原文找到依據。
- 只輸出 JSON 陣列，不要任何前後說明或 markdown 標記。`;

    /* ---------- 資料運算 ---------- */
    function keyOf(s) {
      return `${s.handle}::${s.ticker}`;
    }

    function daysAgo(n) {
      const d = new Date();
      d.setHours(0, 0, 0, 0);
      d.setDate(d.getDate() - n);
      return d.toISOString().slice(0, 10);
    }

    function buildMatrix(signals, accounts) {
      const byKey = new Map();
      signals.forEach((s) => {
        const k = keyOf(s);
        if (!byKey.has(k)) byKey.set(k, []);
        byKey.get(k).push(s);
      });

      const tickers = new Map();
      byKey.forEach((list) => {
        const sorted = [...list].sort((a, b) => (a.date || "").localeCompare(b.date || ""));
        const latest = sorted[sorted.length - 1];
        const prior = [...sorted].reverse().find((s) => s.stance !== latest.stance && s.stance !== "unclear");
        const changed = Boolean(prior) && latest.stance !== "unclear";
        const ticker = latest.ticker;
        if (!tickers.has(ticker)) tickers.set(ticker, { ticker, name: latest.name || "", cells: {} });
        tickers.get(ticker).cells[latest.handle] = {
          ...latest,
          history: sorted,
          changed,
          from: prior ? prior.stance : null,
        };
      });

      return [...tickers.values()].map((row) => {
        const cells = Object.values(row.cells);
        const bull = cells.filter((c) => c.stance === "bull").length;
        const bear = cells.filter((c) => c.stance === "bear").length;
        const neutral = cells.filter((c) => c.stance === "neutral").length;
        const covered = cells.filter((c) => c.stance !== "unclear").length;
        const silent = accounts.length - cells.length;
        const divergence = covered > 0 ? (2 * Math.min(bull, bear)) / covered : 0;
        const net = bull - bear;
        const changes = cells.filter((c) => c.changed).length;
        const lastDate = cells.map((c) => c.date || "").sort().pop() || "";
        const mentionCount = cells.reduce((sum, c) => sum + (c.history?.length || 1), 0);
        return { ...row, bull, bear, neutral, covered, silent, divergence, net, changes, lastDate, mentionCount };
      });
    }

    /* ---------- 小元件 ---------- */
    function StanceCell({ cell, onClick }) {
      if (!cell) {
        return (
          <td className="border border-slate-800 p-0">
            <div className="h-9 w-full flex items-center justify-center text-slate-700 text-xs">·</div>
          </td>
        );
      }
      const st = STANCE[cell.stance] || STANCE.unclear;
      return (
        <td className="border border-slate-800 p-0">
          <button
            onClick={onClick}
            title={`${cell.thesis || ""}${cell.changed ? `（由${STANCE[cell.from]?.label || ""}轉向）` : ""}`}
            className={`h-9 w-full flex items-center justify-center gap-1 ${st.cell} hover:brightness-150 focus:outline-none focus:ring-2 focus:ring-sky-400 transition-[filter]`}
          >
            <span className={`text-xs font-semibold ${st.text}`}>{st.short}</span>
            <span className="flex gap-0.5 items-end">
              {[1, 2, 3].map((i) => (
                <span
                  key={i}
                  className={`w-0.5 rounded-sm ${i <= Math.ceil((cell.conviction || 1) * 0.6) ? st.dot : "bg-slate-700"}`}
                  style={{ height: `${3 + i * 2}px` }}
                />
              ))}
            </span>
            {cell.changed && <span className="w-1.5 h-1.5 rounded-full bg-violet-400" />}
          </button>
        </td>
      );
    }

    function Bar({ bull, bear, neutral }) {
      const total = Math.max(1, bull + bear + neutral);
      return (
        <div className="flex h-1.5 w-20 rounded-sm overflow-hidden bg-slate-800">
          <div className="bg-red-500" style={{ width: `${(bull / total) * 100}%` }} />
          <div className="bg-slate-600" style={{ width: `${(neutral / total) * 100}%` }} />
          <div className="bg-emerald-500" style={{ width: `${(bear / total) * 100}%` }} />
        </div>
      );
    }

    function Modal({ title, children, onClose }) {
      return (
        <div className="fixed inset-0 z-30 flex items-start justify-center bg-slate-950 bg-opacity-80 p-4 overflow-y-auto" onClick={onClose}>
          <div className="mt-10 w-full max-w-2xl rounded-lg border border-slate-700 bg-slate-900 p-5 shadow-xl" onClick={(e) => e.stopPropagation()}>
            <div className="flex items-center justify-between">
              <h2 className="text-lg font-semibold text-slate-50">{title}</h2>
              <button onClick={onClose} className="text-slate-500 hover:text-slate-200 text-sm">關閉</button>
            </div>
            <div className="mt-4">{children}</div>
          </div>
        </div>
      );
    }

    /* ---------- 主元件 ---------- */
    function ConsensusDashboard() {
      const [accounts, setAccounts] = useState(DEFAULT_ACCOUNTS);
      const [signals, setSignals] = useState([]);
      const [loaded, setLoaded] = useState(false);
      const [sortBy, setSortBy] = useState("divergence");
      const [timeRange, setTimeRange] = useState("daily");
      const [mainTab, setMainTab] = useState("dashboard"); // dashboard | accounts | qa
      const [openTicker, setOpenTicker] = useState(null);
      const [panel, setPanel] = useState(null);
      const [busy, setBusy] = useState("");
      const [error, setError] = useState("");
      const [pasted, setPasted] = useState("");
      const [reportLang, setReportLang] = useState("zh-TW");
      const [report, setReport] = useState("");
      const [analysis, setAnalysis] = useState({});
      const [apiKeyInput, setApiKeyInput] = useState("");
      const [qaQuestion, setQaQuestion] = useState("");
      const [qaAnswer, setQaAnswer] = useState("");
      const [dataCutoff, setDataCutoff] = useState("");

      useEffect(() => {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (raw) {
            const parsed = JSON.parse(raw);
            if (parsed.accounts?.length) setAccounts(parsed.accounts);
            if (parsed.signals?.length) setSignals(parsed.signals);
            if (parsed.dataCutoff) setDataCutoff(parsed.dataCutoff);
          }
          const key = localStorage.getItem("anthropic_api_key");
          if (key) setApiKeyInput(key);
        } catch (e) {}
        finally { setLoaded(true); }
      }, []);

      const persist = useCallback((nextAccounts, nextSignals, cutoff) => {
        try {
          const cut = cutoff || dataCutoff || new Date().toISOString();
          localStorage.setItem(STORAGE_KEY, JSON.stringify({
            accounts: nextAccounts,
            signals: nextSignals,
            dataCutoff: cut,
          }));
          if (cutoff) setDataCutoff(cutoff);
        } catch (e) {
          setError("資料存檔失敗，這次的變更只留在畫面上。");
        }
      }, [dataCutoff]);

      const addSignals = useCallback((incoming) => {
        const clean = incoming
          .filter((s) => s && s.handle && s.ticker)
          .map((s) => ({
            id: `${s.handle}-${s.ticker}-${s.date || ""}-${(s.quote || "").slice(0, 12)}`,
            handle: String(s.handle).replace("@", ""),
            ticker: String(s.ticker).toUpperCase(),
            name: s.name || "",
            stance: STANCE[s.stance] ? s.stance : "unclear",
            conviction: Number(s.conviction) || 3,
            evidence: Array.isArray(s.evidence) ? s.evidence : [],
            thesis: s.thesis || "",
            quote: s.quote || "",
            date: s.date || new Date().toISOString().slice(0, 10),
            url: s.url || "",
          }));
        setSignals((prev) => {
          const seen = new Set(prev.map((p) => p.id));
          const merged = [...prev, ...clean.filter((c) => !seen.has(c.id))];
          const cutoff = new Date().toISOString();
          persist(accounts, merged, cutoff);
          return merged;
        });
        return clean.length;
      }, [accounts, persist]);

      const filteredSignals = useMemo(() => {
        const range = TIME_RANGES.find((t) => t.id === timeRange) || TIME_RANGES[0];
        const since = daysAgo(range.days - 1);
        // daily: if too few, include previous day (as Capafy does)
        if (timeRange === "daily") {
          const today = daysAgo(0);
          const todayCount = signals.filter((s) => (s.date || "") >= today).length;
          if (todayCount < 3) {
            const yesterday = daysAgo(1);
            return signals.filter((s) => (s.date || "") >= yesterday);
          }
          return signals.filter((s) => (s.date || "") >= today);
        }
        return signals.filter((s) => (s.date || "") >= since);
      }, [signals, timeRange]);

      const matrix = useMemo(() => {
        const rows = buildMatrix(filteredSignals, accounts);
        const sorters = {
          divergence: (a, b) => b.divergence - a.divergence || b.covered - a.covered,
          coverage: (a, b) => b.covered - a.covered,
          net: (a, b) => b.net - a.net,
          recent: (a, b) => (b.lastDate || "").localeCompare(a.lastDate || ""),
          mentions: (a, b) => b.mentionCount - a.mentionCount,
        };
        return rows.sort(sorters[sortBy] || sorters.divergence);
      }, [filteredSignals, accounts, sortBy]);

      const activeAccounts = useMemo(() => {
        const counts = {};
        filteredSignals.forEach((s) => {
          counts[s.handle] = counts[s.handle] || { bull: 0, bear: 0, neutral: 0, total: 0 };
          if (counts[s.handle][s.stance] !== undefined) counts[s.handle][s.stance] += 1;
          counts[s.handle].total += 1;
        });
        return accounts.map((a) => ({ ...a, stats: counts[a.handle] || { bull: 0, bear: 0, neutral: 0, total: 0 } }));
      }, [accounts, filteredSignals]);

      const summaryStats = useMemo(() => {
        const totalBull = matrix.reduce((s, r) => s + r.bull, 0);
        const totalBear = matrix.reduce((s, r) => s + r.bear, 0);
        const highDiv = matrix.filter((r) => r.divergence >= 0.6).length;
        const changed = matrix.filter((r) => r.changes > 0).length;
        return { totalBull, totalBear, highDiv, changed, tickers: matrix.length };
      }, [matrix]);

      async function ingestPasted() {
        if (!pasted.trim()) return;
        setBusy("正在讀取貼文並標註立場…");
        setError("");
        try {
          const out = await callClaude([{
            role: "user",
            content: `${PARSE_INSTRUCTION}\n\n追蹤名單（handle）：${accounts.map((a) => a.handle).join(", ")}\n今天日期：${new Date().toISOString().slice(0, 10)}\n\n以下是貼文原文：\n"""\n${pasted.slice(0, 12000)}\n"""`,
          }]);
          const rows = extractJson(out);
          const n = addSignals(rows);
          setPasted("");
          setBusy("");
          if (n === 0) setError("這批內容裡沒有可辨識的個股立場。");
          else setPanel(null);
        } catch (e) {
          setBusy("");
          setError(e.message || "標註失敗");
        }
      }

      async function makeReport() {
        setBusy("正在整理共識摘要…");
        setError("");
        try {
          const rows = matrix.slice(0, 15).map((r) => ({
            ticker: r.ticker,
            bull: r.bull,
            bear: r.bear,
            neutral: r.neutral,
            silent: r.silent,
            changes: r.changes,
            divergence: Math.round(r.divergence * 100) / 100,
            views: Object.values(r.cells).map((c) => ({ handle: c.handle, stance: c.stance, thesis: c.thesis })),
          }));
          const rangeLabel = TIME_RANGES.find((t) => t.id === timeRange)?.label || "每日";
          const langLabel = REPORT_LANGS.find((l) => l.id === reportLang)?.label;
          const out = await callClaude([{
            role: "user",
            content: `以下是追蹤帳號在「${rangeLabel}」視角的個股立場統計（JSON）。用${langLabel}寫一份市場共識摘要，350 字內，結構為：一、共識最集中的標的；二、分歧最大的標的與雙方依據差異；三、立場出現轉向的地方。只陳述資料裡有的東西，不要加入預測或投資建議，也不要用 markdown 標題符號。\n\n${JSON.stringify(rows)}`,
          }]);
          setReport(out);
          setBusy("");
        } catch (e) {
          setBusy("");
          setError(e.message || "摘要產生失敗");
        }
      }

      async function analyzeTicker(ticker) {
        setBusy("正在比對各方依據…");
        try {
          const row = matrix.find((r) => r.ticker === ticker);
          const views = Object.values(row.cells).map((c) => ({
            handle: c.handle, stance: c.stance, evidence: c.evidence,
            thesis: c.thesis, quote: c.quote, date: c.date,
            history: (c.history || []).map((h) => ({ date: h.date, stance: h.stance })),
          }));
          const out = await callClaude([{
            role: "user",
            content: `這是多位評論者對 ${ticker} 的公開立場。請用繁體中文寫 180 字內的比較，涵蓋三個時間面向：1) 目前觀點 2) 近期變化 3) 歷史背景中可檢驗的主張。只根據給定內容，不要延伸推論，不要給投資建議。\n\n${JSON.stringify(views)}`,
          }]);
          setAnalysis((prev) => ({ ...prev, [ticker]: out }));
          setBusy("");
        } catch (e) {
          setBusy("");
          setError(e.message || "比對失敗");
        }
      }

      async function askQA() {
        if (!qaQuestion.trim()) return;
        setBusy("正在分析…");
        setQaAnswer("");
        setError("");
        try {
          const context = matrix.slice(0, 20).map((r) => ({
            ticker: r.ticker,
            bull: r.bull, bear: r.bear, neutral: r.neutral,
            views: Object.values(r.cells).map((c) => ({
              handle: c.handle, stance: c.stance, thesis: c.thesis, date: c.date,
            })),
          }));
          const out = await callClaude([{
            role: "user",
            content: `你是市場觀點彙整助手。以下是目前追蹤的 10 個帳號對各股票的公開立場資料（JSON）。請用繁體中文回答使用者問題，優先比較不同帳號的觀點差異，不要把沒提過該股票的帳號當成中立，不要給投資建議。\n\n資料：\n${JSON.stringify(context)}\n\n使用者問題：${qaQuestion}`,
          }]);
          setQaAnswer(out);
          setBusy("");
        } catch (e) {
          setBusy("");
          setError(e.message || "問答失敗");
        }
      }

      function loadDemo() {
        const today = new Date();
        const d = (n) => new Date(today.getTime() - n * 86400000).toISOString().slice(0, 10);
        const demo = [
          { handle: "unusual_whales", ticker: "NVDA", name: "NVIDIA", stance: "bull", conviction: 4, evidence: ["flow", "disclosed_trade"], thesis: "大額買權流入集中在近月", quote: "unusual call flow", date: d(0) },
          { handle: "zerohedge", ticker: "NVDA", name: "NVIDIA", stance: "bear", conviction: 4, evidence: ["valuation", "macro"], thesis: "資本支出循環見頂風險", quote: "capex peak", date: d(0) },
          { handle: "markminervini", ticker: "NVDA", name: "NVIDIA", stance: "bull", conviction: 5, evidence: ["technical"], thesis: "重回關鍵均線且量能回補", quote: "base breakout", date: d(1) },
          { handle: "charliebilello", ticker: "NVDA", name: "NVIDIA", stance: "neutral", conviction: 2, evidence: ["valuation"], thesis: "本益比高於五年均值", quote: "above 5y average", date: d(2) },
          { handle: "LizAnnSonders", ticker: "SPY", name: "S&P 500 ETF", stance: "bear", conviction: 3, evidence: ["macro"], thesis: "市場廣度持續收斂", quote: "narrowing breadth", date: d(0) },
          { handle: "TheStalwart", ticker: "SPY", name: "S&P 500 ETF", stance: "neutral", conviction: 2, evidence: ["macro"], thesis: "等待通膨數據確認", quote: "waiting on CPI", date: d(1) },

                  </div>
                  {analysis[openRow.ticker] ? (
                    <p className="mt-2 whitespace-pre-wrap text-sm leading-relaxed text-slate-300">
                      {analysis[openRow.ticker]}
                    </p>
                  ) : (
                    <p className="mt-2 text-xs text-slate-600">
                      涵蓋目前觀點、近期變化與歷史背景中可檢驗的主張。需 API Key。
                    </p>
                  )}
                </section>
              </div>
            </div>
          )}

          {/* 匯入 */}
          {panel === "ingest" && (
            <Modal title="匯入貼文" onClose={() => setPanel(null)}>
              <p className="text-sm text-slate-400">
                從 X 複製貼文貼在下方，一次可多則。保留帳號與日期即可。需 API Key 才會自動標註；也可直接載入示範資料。
              </p>
              <textarea
                value={pasted}
                onChange={(e) => setPasted(e.target.value)}
                rows={10}
                placeholder={"@unusual_whales 2026-09-10\nNVDA 近月買權出現異常大單…\n\n@zerohedge 2026-09-10\nAI capex 循環…"}
                className="mt-3 w-full rounded border border-slate-700 bg-slate-950 p-3 font-mono text-sm text-slate-200 placeholder-slate-700 focus:outline-none focus:ring-2 focus:ring-sky-400"
              />
              <div className="mt-3 flex flex-wrap gap-2">
                <button onClick={ingestPasted} disabled={!!busy} className="rounded bg-sky-600 px-4 py-2 text-sm font-medium text-white hover:bg-sky-500 disabled:opacity-50">
                  讀取並歸類
                </button>
                <button onClick={loadDemo} className="rounded border border-slate-700 px-4 py-2 text-sm text-slate-400 hover:bg-slate-800">
                  載入示範資料
                </button>
              </div>
            </Modal>
          )}

          {/* 摘要 */}
          {panel === "report" && (
            <Modal title="共識摘要" onClose={() => setPanel(null)}>
              <div className="flex flex-wrap items-center gap-2">
                {REPORT_LANGS.map((l) => (
                  <button
                    key={l.id}
                    onClick={() => setReportLang(l.id)}
                    className={`rounded px-3 py-1.5 text-sm ${reportLang === l.id ? "bg-slate-700 text-slate-100" : "border border-slate-700 text-slate-400 hover:bg-slate-800"}`}
                  >
                    {l.label}
                  </button>
                ))}
                <button
                  onClick={makeReport}
                  disabled={!!busy || matrix.length === 0}
                  className="ml-auto rounded bg-sky-600 px-4 py-2 text-sm font-medium text-white hover:bg-sky-500 disabled:opacity-50"
                >
                  產生摘要
                </button>
              </div>
              {report ? (
                <div className="mt-4">
                  <p className="whitespace-pre-wrap text-sm leading-relaxed text-slate-200">{report}</p>
                  <button
                    onClick={() => navigator.clipboard?.writeText(report)}
                    className="mt-3 rounded border border-slate-700 px-3 py-1.5 text-xs hover:bg-slate-800"
                  >
                    複製全文
                  </button>
                </div>
              ) : (
                <p className="mt-4 text-sm text-slate-600">
                  摘要涵蓋共識最集中、分歧最大、以及立場轉向處。會依目前選擇的時間範圍（每日／每週／每月）產生。
                </p>
              )}
            </Modal>
          )}

          {/* 設定 */}
          {panel === "settings" && (
            <Modal title="設定" onClose={() => setPanel(null)}>
              <p className="text-sm text-slate-400">
                若要使用自動標註、摘要、比對與 AI 問答，請貼上 Anthropic API Key（僅存本機瀏覽器）。
              </p>
              <input
                type="password"
                value={apiKeyInput}
                onChange={(e) => setApiKeyInput(e.target.value)}
                placeholder="sk-ant-..."
                className="mt-3 w-full rounded border border-slate-700 bg-slate-950 px-3 py-2 font-mono text-sm focus:outline-none focus:ring-2 focus:ring-sky-400"
              />
              <div className="mt-3 flex gap-2">
                <button onClick={saveApiKey} className="rounded bg-sky-600 px-4 py-2 text-sm font-medium text-white hover:bg-sky-500">儲存</button>
                <button
                  onClick={() => { localStorage.removeItem("anthropic_api_key"); setApiKeyInput(""); }}
                  className="rounded border border-slate-700 px-4 py-2 text-sm hover:bg-slate-800"
                >
                  清除
                </button>
              </div>
              <p className="mt-4 text-xs text-slate-600">
                沒有 API Key 也能完整使用示範資料與介面。所有立場與摘要僅供參考，不構成投資建議。
              </p>
            </Modal>
          )}

          <footer className="border-t border-slate-800 px-5 py-4 text-xs text-slate-600">
            Alpha Consensus 只整理公開發言，不查證真偽、不代表實際持倉，也不構成投資建議。立場由模型自動判讀，關鍵決策前請回看原文。
          </footer>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<ConsensusDashboard />);
  </script>
</body>
</html>
